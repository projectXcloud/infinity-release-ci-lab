name: Pull request checks
on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
      - run: uv run --no-project python -m unittest discover -s tests -v
      - run: uv run --no-project python ci/pipeline.py check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checked-request-${{ github.run_attempt }}
          path: out/checked-request.json
          if-no-files-found: error
